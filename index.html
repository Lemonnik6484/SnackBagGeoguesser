<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnackBag GeoGuesser</title>
    <link rel="stylesheet" href="./style.css">

    <!--OpenGraphProtocol-->
    <meta content="SnackaGuessr" property="og:title"/>
    <meta content="This is Geoguesser like game with SnackBag locations" property="og:description"/>
    <meta property="og:image" content="/assets/preview.png?v=1"/>
    <meta content="#48c9b0" data-react-helmet="true" name="theme-color"/>
</head>
<body id="main-body">
    <div id="popup" class="popup">
        <div class="popup-content">
            <h2 id="popup-title"></h2>
            <div id="popup-body"></div>
            <button class="popup-close">x</button>
        </div>
    </div>

    <div id="notifications"></div>

    <img id="logo" src="./assets/logo.png" alt="SNACKA GUESSR">

    <div id="planet-container">
        <img id="character" src="./assets/snack.png" alt="Snack">
        <img id="planet" src="./assets/planet.png" alt="Planet">
    </div>

    <p id="username"></p>
    <div id="options">
        <button id="play-btn" class="option" value="play">Play</button>
        <button id="login-btn" class="option" value="login">Log in</button>
        <button id="signup-btn" class="option" value="signup">Sign up</button>
    </div>

    <script src="./script.js"></script>
</body>
</html>
